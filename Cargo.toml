[package]
name = "runlog"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["cargo"] }
csv = "1.4.0"
gpx = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Same major version as gpx uses, so Waypoint::new accepts our Points
geo-types = "0.7"
rstest = "0.28.0"
